<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100d1c" />
    <title>MCPWindow · MCP 服务器可视化管理台</title>
    <script>
      try {
        const saved = localStorage.getItem('mcpwindow-theme')
        document.documentElement.dataset.theme = ['aurora', 'midnight', 'daylight'].includes(saved) ? saved : 'aurora'
      } catch { document.documentElement.dataset.theme = 'aurora' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
